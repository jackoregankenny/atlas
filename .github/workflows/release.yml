name: Release

# Build installable Atlas bundles for every platform and attach them to a
# GitHub Release. Triggered by pushing a version tag, e.g.:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The release is created as a draft so you can write notes and review the
# artifacts before publishing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon
          - platform: macos-latest
            target: aarch64-apple-darwin
          # Intel macOS
          - platform: macos-latest
            target: x86_64-apple-darwin
          # Linux (deb, rpm, AppImage)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Windows (msi, nsis)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            file \
            libgtk-3-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: "Atlas ${{ github.ref_name }}"
          releaseBody: |
            Atlas ${{ github.ref_name }}.

            > Builds are currently **unsigned**. macOS users may need to
            > right-click → Open (or run `xattr -dr com.apple.quarantine`)
            > on first launch; Windows users may see a SmartScreen prompt.
          releaseDraft: true
          prerelease: false
